[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smtp-test-tool"
version = "2.0.0"
description = "A web-based SMTP testing tool with GUI and CLI interfaces"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1,<4",
    "flask-sqlalchemy>=3.1,<4",
    "sqlalchemy>=2.0,<3",
    "gunicorn>=22.0,<24",
    "reportlab>=4.0,<5",
    "email-validator>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-flask>=1.3,<2",
    "pytest-cov>=5.0,<6",
    "playwright>=1.40",
]

[project.scripts]
smtp-tool = "smtp_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
